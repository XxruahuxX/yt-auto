format: quepasaria
style: karaoke
experiment: que-pasaria
title: "¿Y si tu equipo FICHARA a un ROBOT? 🤖⚽ #shorts"
description: |
  Un «¿qué pasaría si…?»: tu equipo ficha a un robot y debuta en un partido normal. Analiza a todos los rivales, no se cansa y marca… pero en la RoboCup (el mundial de robots, que existe desde 1997) los robots todavía se caen a menudo.
  #fútbol #robot #IA #quépasaríasi #humor #fyp #shorts
tags: [qué pasaría si, robot, fútbol, inteligencia artificial, RoboCup, humor fútbol]
hook: "¿Y si tu equipo fichara a un robot?"
scenes:
  - anim: r_fichaje
    pose: celebra
    say: "Última hora: tu equipo acaba de fichar a un robot. Dorsal cero, y presentación con flashes como una estrella."
    highlight: "robot. cero,"
    sfx: [ding]
  - anim: r_partido
    pose: piensa
    say: "Llega su debut. Once contra once, en un partido normal. Y todo el estadio mirándole a él."
    highlight: "debut. él."
  - anim: r_scan
    pose: senala
    say: "Lo primero que hace es analizar a todos los rivales: posición, velocidad, hacia dónde van a correr."
    highlight: "robot. analizar"
  - anim: r_sprint
    pose: celebra
    say: "Los futbolistas más rápidos rondan los treinta y seis kilómetros por hora en un sprint. Pero este no se cansa nunca. Ni en el minuto noventa."
    highlight: "treinta y seis nunca."
  - anim: r_gol
    pose: salto
    say: "Llega al área, calcula el ángulo exacto, y dispara a la escuadra. Gol."
    highlight: "escuadra. Gol."
    sfx: [ding]
  - anim: r_caida
    pose: piensa
    say: "Pero en la vida real, aún no es tan fácil: en la RoboCup, el mundial de robots, todavía se caen al intentar chutar."
    highlight: "RoboCup, caen"
    sfx: [boom]
  - emoji: "🤖"
    say: "¿Qué equipo ficharía antes un robot? Te leo en comentarios. Y síguenos para más."
    highlight: "robot comentarios. síguenos"
