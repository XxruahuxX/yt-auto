title: "El partido que acabó 149-0 😱 (y no es broma) #shorts"
description: |
  En 2002, en Madagascar, el AS Adema ganó 149-0 al SO l'Emyrne. Todos los goles fueron en propia puerta, como protesta contra el arbitraje.
  #fútbol #récords #curiosidades #shorts
tags: [récord fútbol, 149-0, curiosidades fútbol, madagascar, goles en propia puerta]
