experiment: expediente
title: "Robaron la Copa del Mundo… y la encontró un PERRO 🐶 #shorts"
description: |
  Marzo de 1966. A cuatro meses del Mundial de Inglaterra, la Copa Jules Rimet desaparece de una exposición de sellos en Westminster (Londres). Llega un paquete con un trozo de la copa y una nota que pide un rescate. La policía detiene al hombre del rescate, pero la copa no aparece.
  El 27 de marzo, David Corbett saca a pasear a su perro Pickles en Beulah Hill, al sur de Londres. Pickles olfatea un paquete envuelto en periódico junto a un seto: es la Copa del Mundo.
  A Corbett lo interrogan como sospechoso. Pickles recibe la medalla de plata de la National Canine Defence League y lo invitan a la cena de celebración tras la victoria de Inglaterra.
  En 1983 la Jules Rimet vuelve a ser robada, esta vez en la sede de la CBF en Río de Janeiro. Nunca se recuperó.
  #fútbol #historiadelfútbol #mundial #curiosidades #shorts
tags: [copa del mundo robada, jules rimet, pickles, perro, mundial 1966, historia del fútbol, curiosidades fútbol]
