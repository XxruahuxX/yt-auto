title: "¿Por qué las porterías tienen RED? 🥅 El motivo te sorprenderá #shorts"
description: |
  Hasta 1891 las porterías no tenían red. La inventó el ingeniero John Brodie, de Liverpool, para acabar con las discusiones sobre si el balón había entrado.
  #fútbol #curiosidades #historia #shorts
tags: [curiosidades fútbol, portería, red, historia del fútbol, john brodie]
