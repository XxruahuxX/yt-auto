title: "Todos tenemos un amigo que se cree que tiene AURA… 😎⚽ #shorts"
description: |
  Todos tenemos un amigo que se cree que tiene aura: llega a cámara lenta, se coloca las medias veinte segundos y celebra goles que no son suyos. ¿Quién es el del aura en tu grupo? 👇
