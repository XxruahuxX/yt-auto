scenes:
  - anim: x_3d_intro
    say: "Todos tenemos un amigo que se cree que tiene aura. Llega a la pachanga del domingo… a cámara lenta."
    highlight: "aura lenta"
    sfx: [whoosh]
  - anim: x_3d_medias
    say: "Antes de sacar un córner, se coloca las medias. Veinte segundos. Todos esperando, joder."
    highlight: "medias esperando"
  - anim: x_3d_celebra
    say: "Marca otro. Y él sale corriendo a celebrarlo como si fuera suyo."
    highlight: "otro suyo"
  - anim: x_3d_panenka
    say: "Penalti. Lo pide él. Lo tira a lo Panenka… y el portero la coge sin moverse."
    highlight: "Panenka moverse"
  - anim: x_3d_cierre
    say: "Pero tranquilo, el aura no se pierde. Se recarga. ¿Quién es el del aura en tu grupo?"
    highlight: "recarga grupo"
